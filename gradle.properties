# Project-wide Gradle settings.
# JVM arguments for the Gradle daemon (Compose + KSP + Room need headroom).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Parallel execution and build caching for faster local builds.
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX package structure.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Namespaced R classes (smaller R classes, faster builds).
android.nonTransitiveRClass=true
# 16KB page size alignment for Android 15+ (API 35) compatibility
android.bundle.pageSize=16384

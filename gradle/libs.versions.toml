[versions]
# Build
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.9"
kover = "0.9.8"
playPublisher = "3.12.1"

# AndroidX core
coreKtx = "1.17.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"

# UI
composeBom = "2026.06.01"
navigationCompose = "2.9.8"

# DI
# 2.58 is the last Hilt supporting AGP 8.x (2.59+ requires AGP 9 + Gradle 9.1)
hilt = "2.58"
# 1.4.0 requires compileSdk 37 / AGP 9; 1.3.0 is the newest compatible with compileSdk 36
androidxHilt = "1.3.0"

# Data
room = "2.8.4"
datastore = "1.2.1"

# Network
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinxSerialization = "1.11.0"

# Media

# Billing (pure JVM AAR — no .so files, 16KB-safe)
billing = "8.3.0"

# Ads (Google Mobile Ads SDK + UMP consent — no .so files, 16KB-safe; NO mediation adapters)
playServicesAds = "25.4.0"
ump = "4.0.0"

# Play In-App Review (pure JVM AAR — no .so files, 16KB-safe)
playReview = "2.0.2"

# Splash (AndroidX compat — pure Java/resources, no .so files, 16KB-safe)
coreSplashscreen = "1.0.1"

# Firebase (allowed products only — tech_stacks.md §1; no .so files, 16KB-safe)
# BOM-managed like the Compose BOM: individual artifacts stay unpinned so they can
# never drift out of alignment with their transitive Firebase artifacts.
firebaseBom = "34.16.0"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"

# Emulation frontend (GPL-3.0, JitPack) - tech_stacks.md, DECISIONS D-003
libretrodroid = "0.14.0"

# Images
coil = "3.5.0"

# Background
work = "2.11.2"

# Debug
leakcanary = "2.14"

# Test
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
mockk = "1.14.11"
turbine = "1.2.1"
# Must match the coroutines-core the app resolves transitively (currently 1.10.2)
coroutinesTest = "1.10.2"
konsist = "0.17.3"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# Compose (BOM-managed — no individual versions)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }


# Google Play Billing
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# Google Mobile Ads (AdMob) + UMP consent
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }

# Google Play In-App Review (base artifact only — the Task-based API is all we use,
# so review-ktx's coroutine wrapper would be dead weight)
play-review = { group = "com.google.android.play", name = "review", version.ref = "playReview" }

androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# Firebase (BOM-managed — no individual versions; allowed products only, tech_stacks.md §1)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
# Base artifact ONLY — firebase-crashlytics-ndk bundles .so files and breaks the 16KB rule.
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

# Crashlytics NDK: RetroNova runs a native emulation core (analytics.md section 6).
# Version from the Firebase BOM; recent releases ship 16 KB-aligned .so files.
firebase-crashlytics-ndk = { group = "com.google.firebase", name = "firebase-crashlytics-ndk" }

# LibretroDroid frontend (GLRetroView, Oboe audio, save states)
libretrodroid = { group = "com.github.Swordfish90", name = "LibretroDroid", version.ref = "libretrodroid" }

# Coil 3 (shares the OkHttpClient)
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# Debug
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }

[bundles]
coil = ["coil-compose", "coil-network-okhttp"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
